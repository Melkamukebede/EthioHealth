services:
  - type: web
    name: ethiohealth-api
    env: node
    region: frankfurt
    buildCommand: npm install && npx prisma generate && npx prisma migrate deploy
    startCommand: node src/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: ethiohealth-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://melkamukebede.github.io/EthioHealth/

databases:
  - name: ethiohealth-db
    databaseName: ethiohealth
    plan: free
