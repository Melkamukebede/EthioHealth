<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthioHealth AI Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        body { background: #f5f5f5; font-family: Arial, sans-serif; }
        .header { background: #131921; color: white; padding: 12px 20px; }
        .card { border-radius: 12px; border: none; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 15px; }
        .btn-success { background: #10b981; border: none; font-weight: bold; }
        .risk-item { padding: 12px; margin: 8px 0; border-radius: 8px; border-left: 4px solid #ddd; }
        .risk-item.high { background: #fef2f2; border-left-color: #ef4444; }
        .risk-item.medium { background: #fffbeb; border-left-color: #f59e0b; }
        .risk-item.low { background: #f0fdf4; border-left-color: #10b981; }
        .risk-bar { height: 6px; background: #e5e7eb; border-radius: 3px; margin-top: 5px; }
        .risk-bar-fill { height: 100%; border-radius: 3px; }
        .risk-bar-fill.high { background: #ef4444; }
        .risk-bar-fill.medium { background: #f59e0b; }
        .risk-bar-fill.low { background: #10b981; }
        #loadingOverlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); z-index: 9999; justify-content: center; align-items: center; }
        .loading-box { background: white; padding: 30px; border-radius: 16px; text-align: center; }
    </style>
</head>
<body>

    <!-- Loading Overlay -->
    <div id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner-border text-success mb-3" style="width:3rem;height:3rem;"></div>
            <p class="fw-bold" id="loadingText">🤖 Grok AI is analyzing...</p>
        </div>
    </div>

    <!-- Header -->
    <div class="header d-flex justify-content-between align-items-center">
        <div>
            <h5 class="mb-0"><i class="fas fa-heartbeat text-success me-2"></i>EthioHealth AI Pro</h5>
            <small>Grok AI Agent Active</small>
        </div>
        <div>
            <button class="btn btn-sm btn-outline-light" onclick="changeLanguage('en')">EN</button>
            <button class="btn btn-sm btn-outline-light" onclick="changeLanguage('am')">አማ</button>
            <button class="btn btn-sm btn-outline-light" onclick="changeLanguage('om')">OM</button>
        </div>
    </div>

    <!-- Main Content -->
    <div class="container py-3">
        
        <!-- Health Score -->
        <div class="card p-4 text-center">
            <div style="width:80px;height:80px;border-radius:50%;border:5px solid #10b981;margin:0 auto;display:flex;align-items:center;justify-content:center;">
                <span id="healthScore" style="font-size:28px;font-weight:bold;">--</span>
            </div>
            <p class="mt-2 mb-0 fw-bold">Health Score</p>
            <small class="text-muted">Click Analyze to check</small>
        </div>

        <!-- Quick Health Check -->
        <div class="card p-3">
            <h6><i class="fas fa-heartbeat text-success me-2"></i>Quick Health Check</h6>
            <div class="row g-2">
                <div class="col-6">
                    <label class="small">Systolic BP</label>
                    <input type="number" id="inputSystolic" class="form-control" value="135" placeholder="120">
                </div>
                <div class="col-6">
                    <label class="small">Diastolic BP</label>
                    <input type="number" id="inputDiastolic" class="form-control" value="88" placeholder="80">
                </div>
                <div class="col-6">
                    <label class="small">Blood Sugar (mg/dL)</label>
                    <input type="number" id="inputGlucose" class="form-control" value="130" placeholder="95">
                </div>
                <div class="col-6">
                    <label class="small">BMI</label>
                    <input type="number" id="inputBMI" class="form-control" value="27" placeholder="24">
                </div>
                <div class="col-6">
                    <label class="small">Temperature (°C)</label>
                    <input type="number" id="inputTemp" class="form-control" value="37.2" placeholder="36.6" step="0.1">
                </div>
                <div class="col-6">
                    <label class="small">Age</label>
                    <input type="number" id="inputAge" class="form-control" value="45" placeholder="30">
                </div>
            </div>
            <button class="btn btn-success w-100 mt-3 py-2 fw-bold" onclick="runAnalysis()">
                <i class="fas fa-microchip me-2"></i>Analyze with Grok AI
            </button>
        </div>

        <!-- Results -->
        <div class="card p-3">
            <h6><i class="fas fa-chart-pie text-warning me-2"></i>AI Risk Assessment</h6>
            <div id="riskResults">
                <p class="text-center text-muted py-3">Enter vitals and click Analyze</p>
            </div>
        </div>

        <!-- Ethiopian Herbs -->
        <div class="card p-3">
            <h6><i class="fas fa-leaf text-success me-2"></i>Ethiopian Traditional Herbs</h6>
            <div class="row g-2" id="herbList"></div>
        </div>
    </div>

    <!-- Emergency Button -->
    <button onclick="if(confirm('Call 907?'))window.location.href='tel:907'" 
            style="position:fixed;bottom:20px;right:20px;width:56px;height:56px;border-radius:50%;background:#ef4444;color:white;border:none;font-size:24px;box-shadow:0 4px 12px rgba(239,68,68,0.4);z-index:1000;">
        🆘
    </button>

    <script>
        // ============ SIMPLE WORKING ANALYSIS ============
        
        function runAnalysis() {
            console.log('🔬 runAnalysis STARTED');
            
            // Get values
            var systolic = parseFloat(document.getElementById('inputSystolic').value) || 120;
            var diastolic = parseFloat(document.getElementById('inputDiastolic').value) || 80;
            var glucose = parseFloat(document.getElementById('inputGlucose').value) || 95;
            var bmi = parseFloat(document.getElementById('inputBMI').value) || 24;
            var temperature = parseFloat(document.getElementById('inputTemp').value) || 36.6;
            var age = parseFloat(document.getElementById('inputAge').value) || 30;
            
            // SHOW loading
            document.getElementById('loadingOverlay').style.display = 'flex';
            document.getElementById('loadingText').textContent = '🤖 Grok AI analyzing...';
            
            // Process after delay
            setTimeout(function() {
                var findings = [];
                var penalty = 0;
                
                // Hypertension
                var hRisk = 0;
                if (systolic >= 180) hRisk = 60;
                else if (systolic >= 160) hRisk = 45;
                else if (systolic >= 140) hRisk = 30;
                else if (systolic >= 130) hRisk = 15;
                else if (systolic >= 120) hRisk = 5;
                if (diastolic >= 90) hRisk += 20;
                if (age >= 40) hRisk += 10;
                if (bmi >= 30) hRisk += 10;
                hRisk = Math.min(100, hRisk);
                
                if (hRisk > 0) {
                    var level = hRisk >= 50 ? 'high' : hRisk >= 25 ? 'medium' : 'low';
                    penalty += level === 'high' ? 30 : level === 'medium' ? 15 : 5;
                    findings.push({
                        name: 'Hypertension (High BP)',
                        icon: 'fa-tint',
                        risk: hRisk,
                        level: level,
                        treatment: 'Enalapril, Amlodipine | Moringa, Tosign'
                    });
                }
                
                // Diabetes
                var dRisk = 0;
                if (glucose >= 200) dRisk = 50;
                else if (glucose >= 140) dRisk = 35;
                else if (glucose >= 126) dRisk = 20;
                else if (glucose >= 110) dRisk = 10;
                if (bmi >= 30) dRisk += 15;
                if (age >= 45) dRisk += 10;
                dRisk = Math.min(100, dRisk);
                
                if (dRisk > 0) {
                    var level = dRisk >= 50 ? 'high' : dRisk >= 25 ? 'medium' : 'low';
                    penalty += level === 'high' ? 30 : level === 'medium' ? 15 : 5;
                    findings.push({
                        name: 'Type 2 Diabetes',
                        icon: 'fa-candy-cane',
                        risk: dRisk,
                        level: level,
                        treatment: 'Metformin | Moringa, Grawa'
                    });
                }
                
                // Malaria
                var mRisk = 0;
                if (temperature >= 39) mRisk = 50;
                else if (temperature >= 38) mRisk = 30;
                else if (temperature >= 37.5) mRisk = 10;
                var month = new Date().getMonth() + 1;
                if (month >= 6 && month <= 9) mRisk += 25;
                mRisk = Math.min(100, mRisk);
                
                if (mRisk >= 10) {
                    var level = mRisk >= 50 ? 'high' : mRisk >= 25 ? 'medium' : 'low';
                    penalty += level === 'high' ? 25 : 10;
                    findings.push({
                        name: 'Malaria Risk',
                        icon: 'fa-mosquito',
                        risk: mRisk,
                        level: level,
                        treatment: 'Coartem | Neem, Gesho'
                    });
                }
                
                var score = Math.max(0, Math.min(100, 100 - penalty));
                
                // HIDE loading
                document.getElementById('loadingOverlay').style.display = 'none';
                
                // Update score
                var scoreEl = document.getElementById('healthScore');
                scoreEl.textContent = score;
                scoreEl.style.color = score >= 70 ? '#10b981' : score >= 40 ? '#f59e0b' : '#ef4444';
                
                // Show results
                var container = document.getElementById('riskResults');
                if (findings.length === 0) {
                    container.innerHTML = '<p class="text-center text-success py-3">✅ No significant risks detected!</p>';
                } else {
                    var html = '';
                    findings.forEach(function(f) {
                        html += '<div class="risk-item ' + f.level + '">';
                        html += '<div class="d-flex justify-content-between">';
                        html += '<strong><i class="fas ' + f.icon + ' me-2"></i>' + f.name + '</strong>';
                        html += '<span class="fw-bold">' + f.risk + '%</span>';
                        html += '</div>';
                        html += '<div class="risk-bar"><div class="risk-bar-fill ' + f.level + '" style="width:' + f.risk + '%"></div></div>';
                        html += '<small class="text-muted mt-1">💊 ' + f.treatment + '</small>';
                        html += '</div>';
                    });
                    container.innerHTML = html;
                }
                
                console.log('✅ Analysis complete. Score:', score);
                
            }, 1500);
        }
        
        function changeLanguage(lang) {
            localStorage.setItem('lang', lang);
            alert('Language: ' + lang.toUpperCase());
        }
        
        // Load herbs
        function loadHerbs() {
            var herbs = [
                { name: 'Tena Adam', sci: 'Ruta chalepensis', uses: 'Stomach pain, headache, fever' },
                { name: 'Moringa', sci: 'Moringa stenopetala', uses: 'Malnutrition, BP, diabetes' },
                { name: 'Gesho', sci: 'Rhamnus prinoides', uses: 'Digestion, malaria' },
                { name: 'Neem', sci: 'Azadirachta indica', uses: 'Malaria, skin diseases' }
            ];
            
            var html = '';
            herbs.forEach(function(h) {
                html += '<div class="col-6"><div class="card p-2"><strong>' + h.name + '</strong><br><small class="text-muted">' + h.sci + '</small><br><small>' + h.uses + '</small></div></div>';
            });
            
            document.getElementById('herbList').innerHTML = html;
        }
        
        // Initialize
        loadHerbs();
        console.log('✅ EthioHealth AI Pro Ready');
    </script>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
