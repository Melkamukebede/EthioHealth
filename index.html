<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EthioHealth AI Pro - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --amazon-dark: #131921;
            --amazon-nav: #232F3E;
            --amazon-yellow: #FFD814;
            --amazon-orange: #FF9900;
            --primary: #10b981;
            --eth-green: #078930;
            --eth-yellow: #FCDD09;
            --eth-red: #DA121A;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { 
            background: linear-gradient(135deg, #f0fdf4 0%, #ecfdf5 50%, #fefce8 100%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .flag-stripe { display:flex; height:4px; position:fixed; top:0; left:0; right:0; z-index:1000; }
        .flag-stripe div:nth-child(1) { flex:1; background:var(--eth-green); }
        .flag-stripe div:nth-child(2) { flex:1; background:var(--eth-yellow); }
        .flag-stripe div:nth-child(3) { flex:1; background:var(--eth-red); }
        .auth-container { max-width:420px; width:100%; padding:20px; }
        .auth-card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }
        .auth-card .logo { text-align:center; margin-bottom:20px; }
        .auth-card .logo i { font-size:50px; color:var(--primary); }
        .auth-card h3 { font-weight:bold; color:#0F1111; }
        .btn-auth {
            background: var(--amazon-yellow);
            color: #0F1111;
            font-weight: bold;
            border: none;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            font-size: 15px;
            cursor: pointer;
            transition: all 0.2s;
        }
        .btn-auth:hover { background: #F7CA00; }
        .btn-outline-auth {
            background: white;
            border: 1px solid #ddd;
            padding: 12px;
            border-radius: 8px;
            width: 100%;
            cursor: pointer;
        }
        .form-control { padding:12px; border-radius:8px; border:1.5px solid #ddd; }
        .form-control:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(16,185,129,0.1); }
        .toggle-link { color:var(--primary); cursor:pointer; text-decoration:none; font-weight:600; }
        .toggle-link:hover { text-decoration:underline; }
        .alert { border-radius:8px; font-size:14px; }
        #loadingOverlay {
            display:none; position:fixed; top:0; left:0; width:100%; height:100%;
            background:rgba(0,0,0,0.5); z-index:9999;
            justify-content:center; align-items:center;
        }
        .loading-box { background:white; padding:20px 30px; border-radius:12px; text-align:center; }
    </style>
</head>
<body>

    <!-- Ethiopian Flag -->
    <div class="flag-stripe"><div></div><div></div><div></div></div>

    <!-- Loading -->
    <div id="loadingOverlay">
        <div class="loading-box">
            <div class="spinner-border text-success mb-2"></div>
            <p class="fw-bold mb-0">Please wait...</p>
        </div>
    </div>

    <!-- Auth Container -->
    <div class="auth-container">
        <div class="auth-card">
            <!-- Logo -->
            <div class="logo">
                <i class="fas fa-heartbeat"></i>
                <h3 class="mt-2">EthioHealth AI Pro</h3>
                <small class="text-muted">Grok AI Health Companion</small>
            </div>

            <!-- Login Form -->
            <div id="loginForm">
                <h5 class="mb-3"><i class="fas fa-sign-in-alt me-2"></i>Sign In</h5>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="loginEmail" class="form-control" placeholder="Enter your email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="loginPassword" class="form-control" placeholder="Enter your password">
                </div>
                <div id="loginAlert" class="alert alert-danger" style="display:none;"></div>
                <button class="btn-auth mb-3" onclick="handleLogin()">
                    <i class="fas fa-sign-in-alt me-2"></i>Sign In
                </button>
                <p class="text-center mb-0">
                    New to EthioHealth? 
                    <span class="toggle-link" onclick="showRegister()">Create Account</span>
                </p>
                <p class="text-center mt-2">
                    <span class="toggle-link" onclick="skipLogin()">Skip & Continue as Guest</span>
                </p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display:none;">
                <h5 class="mb-3"><i class="fas fa-user-plus me-2"></i>Create Account</h5>
                <div class="mb-3">
                    <label class="form-label">Full Name</label>
                    <input type="text" id="registerName" class="form-control" placeholder="Enter your name">
                </div>
                <div class="mb-3">
                    <label class="form-label">Email</label>
                    <input type="email" id="registerEmail" class="form-control" placeholder="Enter your email">
                </div>
                <div class="mb-3">
                    <label class="form-label">Password</label>
                    <input type="password" id="registerPassword" class="form-control" placeholder="Min 6 characters">
                </div>
                <div id="registerAlert" class="alert alert-danger" style="display:none;"></div>
                <button class="btn-auth mb-3" onclick="handleRegister()">
                    <i class="fas fa-user-plus me-2"></i>Create Account
                </button>
                <p class="text-center mb-0">
                    Already have an account? 
                    <span class="toggle-link" onclick="showLogin()">Sign In</span>
                </p>
            </div>
        </div>
    </div>

    <script>
        const API_URL = 'https://ethiohalth-api.onrender.com/api/v1';

        function showLoading() { document.getElementById('loadingOverlay').style.display = 'flex'; }
        function hideLoading() { document.getElementById('loadingOverlay').style.display = 'none'; }

        function showRegister() {
            document.getElementById('loginForm').style.display = 'none';
            document.getElementById('registerForm').style.display = 'block';
        }

        function showLogin() {
            document.getElementById('registerForm').style.display = 'none';
            document.getElementById('loginForm').style.display = 'block';
        }

        function skipLogin() {
            localStorage.setItem('guest', 'true');
            window.location.href = 'dashboard.html';
        }

        async function handleLogin() {
            const email = document.getElementById('loginEmail').value;
            const password = document.getElementById('loginPassword').value;
            const alert = document.getElementById('loginAlert');

            if (!email || !password) {
                alert.textContent = 'Please fill all fields';
                alert.style.display = 'block';
                return;
            }

            showLoading();
            try {
                const res = await fetch(API_URL + '/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });
                const data = await res.json();
                hideLoading();

                if (data.success) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    localStorage.removeItem('guest');
                    window.location.href = 'dashboard.html';
                } else {
                    alert.textContent = data.message || 'Login failed';
                    alert.style.display = 'block';
                }
            } catch (err) {
                hideLoading();
                alert.textContent = 'Cannot connect to server';
                alert.style.display = 'block';
            }
        }

        async function handleRegister() {
            const name = document.getElementById('registerName').value;
            const email = document.getElementById('registerEmail').value;
            const password = document.getElementById('registerPassword').value;
            const alert = document.getElementById('registerAlert');

            if (!name || !email || !password) {
                alert.textContent = 'Please fill all fields';
                alert.style.display = 'block';
                return;
            }
            if (password.length < 6) {
                alert.textContent = 'Password must be at least 6 characters';
                alert.style.display = 'block';
                return;
            }

            showLoading();
            try {
                const res = await fetch(API_URL + '/auth/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, email, password })
                });
                const data = await res.json();
                hideLoading();

                if (data.success) {
                    localStorage.setItem('token', data.data.token);
                    localStorage.setItem('user', JSON.stringify(data.data.user));
                    window.location.href = 'dashboard.html';
                } else {
                    alert.textContent = data.message || 'Registration failed';
                    alert.style.display = 'block';
                }
            } catch (err) {
                hideLoading();
                alert.textContent = 'Cannot connect to server';
                alert.style.display = 'block';
            }
        }

        // Check if already logged in
        if (localStorage.getItem('token') || localStorage.getItem('guest')) {
            window.location.href = 'dashboard.html';
        }
    </script>
</body>
</html>
